[env:ch582f]
platform = https://github.com/Community-PIO-CH32V/platform-ch32v.git
board = ch582f
framework = noneos-sdk

build_flags =
    -I src
    -std=gnu++17
    -Wno-overflow
    -I${PROJECT_DIR}/include
    -I${PROJECT_DIR}/src
    -I${PROJECT_DIR}/lib/HAL
    -L${PROJECT_DIR}/lib/HAL
    -lCH58xBLE